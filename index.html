<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/images/flaticon.png"
      type="image/x-icon"
    />

    <meta

            <a class="navbar-brand" href="#">

                class="img-fluid"

                  </li>

              <span id="cart-count" class="count">10</span>
