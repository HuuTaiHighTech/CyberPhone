                <!-- MODAL CONTAINER (Form ẩn mặc định) -->
                <div id="productModal" class="modal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5>Thêm mới sản phẩm</h5>
                            <span class="close-btn" id="closeHeaderBtn">&times;</span>
                        </div>

                        <!-- FORM NHẬP THÔNG TIN -->
                        <form id="addProductForm">
                            <!-- ID -->
                            <div class="form-group">
                                <label for="productID">ID: </label>
                                <input type="text" class="form-control" id="id" placeholder="Nhập ID sản phẩm">
                                <p id="err_required_id" class="text text-danger"></p>
                            </div>
                            <!-- Name  -->
                            <div class="form-group">
                                <label for="productName">Name: </label>
                                <input type="text" class="form-control" id="name" placeholder="Nhập tên sản phẩm">
                                <p id="err_required_name" class="text text-danger"></p>
                            </div>
                            <!-- Price  -->
                            <div class="form-group">
                                <label for="productPrice">Price:</label>
                                <input type="number" class="form-control" id="price" placeholder="Nhập giá bán">
                                <p id="err_required_price" class="text text-danger"></p>
                            </div>
                            <!-- Img  -->
                            <div class="form-group">
                                <label for="productImg">Img: </label>
                                <!-- Input chọn file ảnh -->
                                <input type="file" class="form-control" id="productImage" accept="image/*">

                                <!-- Thẻ hiển thị hình ảnh xem trước -->
                                <div class="image-preview-container">
                                    <img class="form-control" id="imagePreview" src="#" alt="Xem trước hình ảnh"
                                        style="display: none; max-width: 100%; height: 100%; margin-top: 10px; border-radius: 4px; object-fit: cover;">
                                </div>
                            </div>
                            <!-- Description -->
                            <div class="form-group">
                                <label for="productDescription">Description: </label>
                                <input type="text" class="form-control" id="description" placeholder="Nhập mô tả">
                                <p id="err_required_description" class="text text-danger"></p>
                            </div>
                            <!-- Type -->
                            <div class="form-group">
                                <label for="productType">Type: </label>
                                <select id="type" class="form-control">
                                    <option value="">-- Chọn loại sản phẩm --</option>
                                    <option value="Iphone">Iphone</option>
                                    <option value="Samsung">Samsung</option>
                                </select>
                            </div>

                            <!-- CÁC NÚT THAO TÁC -->
                            <div class="modal-actions">
                                <button id="btnCreate" type="submit" class="btn btn-primary">Create</button>
                                <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                            </div>
                        </form>

                    </div>
                </div>

                <!-- MODAL UPDATE (Form Chỉnh Sửa) -->
                <div id="updateProductModal" class="modal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5>Chỉnh sửa sản phẩm</h5>
                            <span class="close-btn" id="closeUpdateHeaderBtn">&times;</span>
                        </div>

                        <form id="updateProductForm">
                            <!-- ID (Khóa không cho sửa ID) -->
                            <div class="form-group">
                                <label for="updateID">ID: </label>
                                <input type="text" class="form-control" id="update_id" readonly>
                            </div>
                            <!-- Name -->
                            <div class="form-group">
                                <label for="updateName">Name: </label>
                                <input type="text" class="form-control" id="update_name"
                                    placeholder="Nhập tên sản phẩm">
                                <p id="err_required_nameUP" class="text text-danger"></p>
                            </div>
                            <!-- Price -->
                            <div class="form-group">
                                <label for="updatePrice">Price:</label>
                                <input type="number" class="form-control" id="update_price" placeholder="Nhập giá bán">
                                <p id="err_required_priceUP" class="text text-danger"></p>
                            </div>
                            <!-- Img -->
                            <div class="form-group">
                                <label for="updateImg">Img: </label>
                                <input type="file" class="form-control" id="updateProductImage" accept="image/*">
                                <div class="image-preview-container">
                                    <img class="form-control" id="updateImagePreview" src="#" alt="Xem trước hình ảnh"
                                        style="display: none; max-width: 100%; height: 100%; margin-top: 10px; border-radius: 4px; object-fit: cover;">
                                </div>
                            </div>
                            <!-- Description -->
                            <div class="form-group">
                                <label for="updateDescription">Description: </label>
                                <input type="text" class="form-control" id="update_description"
                                    placeholder="Nhập mô tả">
                                <p id="err_required_descriptionUP" class="text text-danger"></p>
                            </div>
                            <!-- Type -->
                            <div class="form-group">
                                <label for="updateType">Type: </label>
                                <select id="update_type" class="form-control">
                                    <option value="">-- Chọn loại sản phẩm --</option>
                                    <option value="Iphone">Iphone</option>
                                    <option value="Samsung">Samsung</option>
                                </select>
                            </div>

                            <!-- NÚT THAO TÁC (Chỉ chứa nút Update) -->
                            <div class="modal-actions">
                                <button id="btnUpdate" type="button" class="btn btn-success">Update</button>
                                <button type="button" id="cancelUpdateBtn" class="btn btn-secondary">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>

            <!-- Classie -->

            <script>
                var menuLeft = document.getElementById('cbp-spmenu-s1'),
                    showLeftPush = document.getElementById('showLeftPush'),
                    body = document.body;

                showLeftPush.onclick = function () {
                    classie.toggle(this, 'active');
                    classie.toggle(body, 'cbp-spmenu-push-toright');
                    classie.toggle(menuLeft, 'cbp-spmenu-open');
                    disableOther('showLeftPush');
                };


                function disableOther(button) {
                    if (button !== 'showLeftPush') {
                        classie.toggle(showLeftPush, 'disabled');
                    }
                }
            </script>
